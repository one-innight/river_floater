# 无域名演示部署：仅通过公网 IP 的 HTTP 访问。
# 适用于浏览器体验；不支持 HTTPS 及 PWA 安装能力。
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.server
    environment:
      RIVER_DATABASE: /app/runtime/river_litter_mvp.db
    ports:
      - "80:8000"
    volumes:
      - ./runtime:/app/runtime
      - ./runtime/uploads:/app/static/uploads
