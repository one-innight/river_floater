services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      RIVER_DATABASE: /app/runtime/river_litter_mvp.db
    volumes:
      - ./runtime:/app/runtime
      - ./runtime/uploads:/app/static/uploads
    expose:
      - "8000"

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - app
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
